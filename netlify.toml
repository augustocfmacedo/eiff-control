# Publicacao automatica: o Netlify roda o build a cada push no repositorio conectado.
# As variaveis VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY devem ser definidas no painel do Netlify
# (Site configuration > Environment variables), porque o arquivo .env nao vai para o repositorio.
[build]
  command = "npm run build"
  publish = "dist"

# Fora de production o build so roda depois da guarda de credenciais (docs/seguranca/credenciais-previews.md, D3):
# credencial privilegiada visivel no contexto recusa o build e o preview nao e publicado. Production nao muda.
[context.deploy-preview]
  command = "node scripts/guarda-credenciais-contexto.mjs && npm run build"

[context.branch-deploy]
  command = "node scripts/guarda-credenciais-contexto.mjs && npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Funcoes serverless (assistente com IA): netlify/functions; exige ANTHROPIC_API_KEY no painel
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA com roteamento por hash: nada a reescrever; cabecalhos de seguranca basicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# a pagina inicial e o manifesto nunca ficam presos em cache: cada publicacao troca o nome dos assets
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
